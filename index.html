<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="hud">
            <div class="hud-stats">
                <div class="stat">
                    <span class="stat-label">SCORE</span>
                    <span class="stat-value stat-score" id="score">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">COINS</span>
                    <span class="stat-value stat-coins"><span id="coinCount">0</span><span class="coin-sep">/</span><span id="coinTotal">0</span></span>
                </div>
                <div class="stat" id="livesStat">
                    <span class="stat-label">LIVES</span>
                    <span class="stat-value stat-lives"><span id="livesNum">3</span><span id="livesHearts"></span></span>
                </div>
                <div class="stat">
                    <span class="stat-label">LEVEL</span>
                    <span class="stat-value stat-level" id="levelNum">1</span>
                </div>
            </div>
            <div class="hud-actions">
                <div id="powerHud" class="stat power-hud">
                    <span class="power-line">
                        <span id="powerName">POWER-UP: NONE</span>
                        <span id="powerTime"></span>
                    </span>
                    <span id="powerTimerBarWrap"><span id="powerTimerBar"></span></span>
                </div>
                <button id="soundBtn" class="hud-btn" title="Toggle sound">🔊 SOUND ON</button>
                <button id="pauseBtn" class="hud-btn pause-btn" title="Pause game">⏸ PAUSE</button>
            </div>
        </div>

        <div id="game">
            <!-- Scenery (hills and clouds) is shared by all levels.
                 Each level recolors it through a theme class on #game. -->
            <div class="hill" style="left:80px;width:180px;height:70px"></div>
            <div class="hill" style="left:400px;width:140px;height:55px"></div>
            <div class="hill" style="left:650px;width:200px;height:80px"></div>

            <div class="cloud" style="left:60px;top:40px;width:90px;height:30px"></div>
            <div class="cloud" style="left:300px;top:25px;width:120px;height:35px"></div>
            <div class="cloud" style="left:550px;top:50px;width:70px;height:25px"></div>
            <div class="cloud" style="left:760px;top:15px;width:100px;height:30px"></div>

            <!-- Platforms, coins, power-ups and enemies are built here
                 by script.js from the LEVELS data for each level -->
            <div id="entities"></div>

            <div id="player"></div>

            <div id="goal"></div>

            <!-- Day 7: boss health bar, shown only during the
                 Level 3 boss fight (script.js toggles .hidden) -->
            <div id="bossHud" class="hidden">
                <span id="bossName">ARENA BRUTE</span>
                <span id="bossSegs"></span>
            </div>

            <!-- Short "LEVEL X" banner shown when a level starts -->
            <div id="levelBanner"></div>

            <div id="message">
                <h1 id="messageText">GAME OVER</h1>
                <p id="messageInfo"></p>
                <button id="messageBtn">Restart</button>
            </div>

            <!-- Day 9: pause / settings overlay (shown by script.js) -->
            <div id="pauseMenu">
                <h2>GAME PAUSED</h2>
                <p class="pause-hint">Press P or Esc to resume</p>
                <button id="resumeBtn" class="pause-menu-btn resume-btn">RESUME</button>
                <button id="restartBtn" class="pause-menu-btn restart-btn">RESTART</button>
                <button id="pauseSoundBtn" class="pause-menu-btn sound-btn">🔊 SOUND ON</button>
            </div>
        </div>

        <div class="controls">
            <p>&larr; &rarr; Move &nbsp;|&nbsp; &uarr; / Space = Jump &nbsp;|&nbsp; P / Esc = Pause &nbsp;|&nbsp; Touch the flags to set your respawn point &nbsp;|&nbsp; Stomp the Level 3 boss to break the gate and reach the flag</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
